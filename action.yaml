name: "Debug with shell"
description: |
  Debug GitHub Actions runs interactively using a shell.
branding:
  icon: "terminal"
inputs:
  server:
    description: "Upterm server URL incl. scheme - e.g. wss://your.server"
    required: true
  continue:
    description: "Should remaining steps be executed when ssh session got closed?"
    default: "true"
  debug:
    description: "Do you need more debug output information?"
    default: "false"
runs:
  using: composite

  steps:
  - name: check prerequisites
    shell: bash
    run: |
      echo "::group::check prerequisites"
      if [[ "${{ inputs.server }}" != ws://* && "${{ inputs.server }}" != wss://* ]]; then
        echo "server must be a ws:// or wss:// URL"
        exit 1
      fi
      echo "::endgroup::"

  - name: check runner type
    shell: bash
    id: check_runner_type
    run: |
      echo "::group::check runner type"
      if [[ $(printenv | grep KUBERNETES_) ]]; then
        runner_home="/runner"
      else
        runner_home='$HOME/actions-runner'
      fi
      echo "runner_home=$runner_home" >> $GITHUB_OUTPUT
      echo "::endgroup::"

  - name: prepare time
    if: steps.check_runner_type.outputs.runner_home != '/runner'
    shell: bash
    run: |
      # make sure this doesn't fail
      set +e
      echo "::group::prepare time"
      # set the real time
      sudo date -s "$(wget -qSO- --max-redirect=0 google.com 2>&1 | grep Date: | cut -d' ' -f5-8)Z"
      # and add some seconds to be one the safe side
      sudo date -s "$(date --date='5 seconds')"
      echo "::endgroup::"

  - name: install upterm
    shell: bash
    run: |
      echo "::group::install upterm"
      if ! command -v upterm > /dev/null; then
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "unsupported architecture: $(uname -m)"; exit 1 ;;
        esac
        mkdir -p "$HOME/.local/bin"
        curl -sSfL "https://github.com/owenthereal/upterm/releases/latest/download/upterm_linux_${arch}.tar.gz" \
          | tar -xz -C "$HOME/.local/bin" upterm
        echo "$HOME/.local/bin" >> $GITHUB_PATH
      fi
      echo "::endgroup::"

  - name: run upterm
    shell: bash
    run: |
      echo "::group::run upterm"

      # prepare motd
      # we don't know the version.. so let's just search for it
      motd_template_path=$(find $GITHUB_ACTION_PATH -iname motd_template | head -n1)
      motd_path=$GITHUB_ACTION_PATH/motd
      sed 's|<RUNNER_HOME>|${{ steps.check_runner_type.outputs.runner_home }}|g' $motd_template_path > $motd_path
      # the session runs 'bash -l', which skips ~/.bashrc unless a login file sources it;
      # bash reads only the first of these that exists, so append there (or create ~/.profile)
      login_file="$HOME/.profile"
      for f in "$HOME/.bash_profile" "$HOME/.bash_login" "$HOME/.profile"; do
        if [ -e "$f" ]; then login_file="$f"; break; fi
      done
      echo "cat ${motd_path}" >> "$login_file"

      # prepare logout behavior
      if [[ ${{ inputs.continue }} == "true" ]]; then
        echo "touch ${HOME}/action_continue" >> ~/.bash_logout
      fi

      # run upterm
      upterm version || /bin/true
      # wss: server is authenticated via TLS, no ssh host key (port 22) is exposed
      nohup upterm host --server ${{ inputs.server }} \
        --skip-host-key-check \
        --accept \
        --force-command 'bash -l' -- /bin/tail -f /dev/null &

      # upterm creates the admin socket only after the session is established;
      # newer versions bind <runtime dir>/sessions/<name>/admin.sock, older ones <runtime dir>/*.sock
      find_socket() {
        find "${XDG_RUNTIME_DIR:-/nonexistent}" "/run/user/$(id -u)" "$HOME/.upterm" \
          -maxdepth 4 -name '*.sock' -not -name 'attach.sock' -path '*upterm*' 2>/dev/null | head -n1 || true
      }
      upterm_sock=""
      for _ in $(seq 1 30); do
        upterm_sock="$(find_socket)"
        [ -n "$upterm_sock" ] && break
        sleep 1
      done
      if [ -z "$upterm_sock" ]; then
        echo "upterm session did not start"
        cat nohup.out 2>/dev/null || true
        find "$HOME/.upterm" "$HOME/.local/state/upterm" -name upterm.log -exec cat {} + 2>/dev/null || true
        exit 1
      fi
      echo "UPTERM_SOCK=$upterm_sock" >> "$GITHUB_ENV"
      echo "::endgroup::"

  - name: wait for upterm server to start
    shell: bash
    run: |
      echo "::group::print connection string"
      count=0
      # the scheme may be a masked secret and would print as ***; split it with shell quoting so the pasted command still resolves to the real URL
      scheme="${{ inputs.server }}"
      scheme="${scheme%%://*}://"
      split_scheme="${scheme%/}'\\'''\\''/"
      while [ ! -e $HOME/action_continue ] ; do
        session_info="$(upterm session current --admin-socket "$UPTERM_SOCK")"
        echo "${session_info//"$scheme"/"$split_scheme"}"
        if [[ ${{ inputs.debug }} == "true" ]]; then
          date
        fi
        # check if we have a connection
        if [[ $(upterm session current --admin-socket "$UPTERM_SOCK" | grep "Connected Client" | wc -l) -eq 0 && $count -eq 20 ]]; then
          echo "no connection established within 10 minutes --> forcing upterm to shutdown"
          touch $HOME/action_continue
        fi
        ((count=count+1))
        sleep 30
      done
      echo "::endgroup::"

  - name: get upterm log
    if: always() && github.event.inputs.debug == 'true'
    shell: bash
    run: |
      cat $HOME/.upterm/upterm.log
